<div class="card" [style.background-color]="hero.completata ? 'lightgreen'
: 'white'">
<h3>{{ hero.nome }}</h3>
<p>Potere: {{ hero.potere }}</p>
<button (click)="notifyParent()" class="complete-btn">
{{ hero.completata ? 'Togli completamento' : 'Completa missione' }}
</button>
<br><br>
<button (click)="editHero()" class="modify-btn">
Modifica
</button>
</div>
