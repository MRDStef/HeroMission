<div class="container" style="text-align: center;">
    <h1>Mission Control Center</h1>
    <button (click)="addHero()">Aggiungi Eroe</button>
    <div class="card-grid">
        <app-hero-card
            *ngFor="let h of heroService.heroes()"
            [hero]="h"
            (onMissionDone)="mark($event)"
            (onEdit)="editHero($event)">
        </app-hero-card>
    </div>
    <p>Missioni completate: {{ totalCompleted }}</p>
</div>
